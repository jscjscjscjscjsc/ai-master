<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Master — 章节</title>
<link rel="stylesheet" href="static/css/style.css">
<link rel="stylesheet" href="static/css/chapter-explorer.css">
<link rel="icon" href="static/favicon.svg">
<style>
body.chapter-page { background: var(--bg, #060818); }
.chapter-content { max-width: 960px; margin: 0 auto; padding: 20px 24px 60px; position: relative; z-index: 2; }
.kp-card { margin-bottom: 20px; }
.kp-card .kp-body { display: none; }
.kp-card.open .kp-body { display: block; }
.exercise-card { margin-bottom: 16px; padding: 20px 24px; border-radius: 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); }
.exercise-card .options { margin: 12px 0; }
.exercise-card .option { display: block; padding: 8px 14px; margin: 4px 0; border-radius: 8px; cursor: pointer; transition: background .2s; }
.exercise-card .option:hover { background: rgba(0,212,255,0.1); }
.exercise-card .option.selected { background: rgba(0,212,255,0.2); border: 1px solid rgba(0,212,255,0.4); }
.exercise-card .option.correct { background: rgba(52,211,153,0.2); border: 1px solid rgba(52,211,153,0.5); }
.exercise-card .option.wrong { background: rgba(239,68,68,0.2); border: 1px solid rgba(239,68,68,0.5); }
.exercise-card .explanation { display: none; margin-top: 12px; padding: 12px 16px; border-radius: 8px; background: rgba(255,255,255,0.05); font-size: 14px; line-height: 1.7; color: var(--muted, #8aa0bd); }
.exercise-card .explanation.show { display: block; }
.kp-header { cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-radius: 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); transition: all .25s; }
.kp-header:hover { background: rgba(255,255,255,0.08); }
.kp-header .arrow { margin-left: auto; transition: transform .3s; font-size: 18px; }
.kp-card.open .kp-header .arrow { transform: rotate(90deg); }
.kp-body { padding: 20px 20px 10px; }
.kp-body table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 14px; }
.kp-body th, .kp-body td { padding: 8px 12px; border: 1px solid rgba(255,255,255,0.1); text-align: left; }
.kp-body th { background: rgba(0,212,255,0.1); font-weight: 600; }
.kp-body pre { background: rgba(0,0,0,0.4); padding: 16px; border-radius: 8px; overflow-x: auto; font-size: 13px; line-height: 1.6; }
.kp-body ul, .kp-body ol { padding-left: 20px; line-height: 1.8; }
#loading { text-align: center; padding: 80px 20px; color: var(--muted, #8aa0bd); }
#loading .spinner { display: inline-block; width: 40px; height: 40px; border: 3px solid rgba(0,212,255,0.2); border-top-color: #00d9ff; border-radius: 50%; animation: spin .8s linear infinite; margin-bottom: 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
.error-page { text-align: center; padding: 80px 20px; }
.error-page h2 { font-size: 28px; margin-bottom: 12px; }
.error-page p { color: var(--muted, #8aa0bd); }
</style>
</head>
<body class="chapter-page" id="top">
<div class="bg-grid"></div>
<canvas id="particles-canvas"></canvas>

<nav class="top-nav">
  <div class="nav-inner">
    <div class="nav-brand">
      <span class="brand-icon" aria-hidden="true"><i></i></span>
      <span><b>AI MASTER</b><small> / STELLAR ARCHIVE</small></span>
    </div>
    <div class="nav-user">
      <a href="index.html" class="btn-ghost" style="padding:6px 14px;font-size:13px;">← 返回首页</a>
      <button class="btn-theme-toggle" onclick="toggleTheme()" title="切换主题"><i class="ui-glyph glyph-eclipse"></i></button>
    </div>
  </div>
</nav>

<div id="loading"><div class="spinner"></div><p>加载星域数据...</p></div>

<div class="chapter-content" id="chapter-content" style="display:none">
  <div class="chapter-hero">
    <div class="hero-planet" aria-hidden="true"><span class="planet-core"></span><span class="planet-ring ring-a"></span><span class="planet-ring ring-b"></span><span class="planet-moon"></span></div>
    <div class="hero-copy">
      <div class="hero-kicker"><span>SECTOR <span id="ch-id-display">00</span></span><i></i><span>KNOWLEDGE EXPEDITION</span></div>
      <h2 id="ch-title"></h2>
      <p class="hero-desc" id="ch-desc"></p>
      <div class="hero-telemetry" id="ch-telemetry"></div>
    </div>
    <div class="hero-buttons" id="ch-buttons"></div>
  </div>

  <div class="kp-section" id="kp-section">
    <h3 class="section-title"><span class="section-icon">✦</span> 知识星体</h3>
    <div id="kp-list"></div>
  </div>

  <div class="exercise-section" id="exercise-section" style="margin-top:40px;">
    <h3 class="section-title"><span class="section-icon">◆</span> 训练任务</h3>
    <div id="exercise-list"></div>
  </div>
</div>

<footer class="dashboard-footer" style="position:relative;z-index:2;padding:20px 24px;text-align:center;">
  <span>AI MASTER / PUBLIC EXPEDITION SYSTEM</span>
  <a href="#top" style="margin-left:16px;">返回顶部 ↑</a>
</footer>

<script src="static/js/main.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const chapterId = params.get('id') || 1;

function toggleTheme() {
  document.body.classList.toggle('light-theme');
  localStorage.setItem('aimaster_theme', document.body.classList.contains('light-theme') ? 'light' : 'dark');
}
if (localStorage.getItem('aimaster_theme') === 'light') document.body.classList.add('light-theme');

fetch('data/chapter_' + String(chapterId).padStart(2, '0') + '.json')
  .then(r => { if (!r.ok) throw new Error('Not found'); return r.json(); })
  .then(chapter => {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('chapter-content').style.display = 'block';
    document.title = 'AI Master — ' + chapter.title;
    document.getElementById('ch-id-display').textContent = String(chapter.id).padStart(2, '0');
    document.getElementById('ch-title').textContent = chapter.icon + ' ' + chapter.title;
    document.getElementById('ch-desc').textContent = chapter.description;
    document.getElementById('ch-telemetry').innerHTML = '<span>星域 ' + String(chapter.id).padStart(2, '0') + '</span><span>' + (chapter.knowledge_points ? chapter.knowledge_points.length : 0) + ' 个知识航标</span><span>GitHub Pages 免费版</span>';

    if (chapter.ppt_url) {
      document.getElementById('ch-buttons').innerHTML = '<a href="' + chapter.ppt_url + '" target="_blank" class="btn-ppt-hero">查看本章档案 ↗</a>';
    }

    // Knowledge Points
    if (chapter.knowledge_points) {
      const kpList = document.getElementById('kp-list');
      chapter.knowledge_points.forEach((kp, i) => {
        const card = document.createElement('div');
        card.className = 'kp-card';
        card.innerHTML = '<div class="kp-header" onclick="this.parentElement.classList.toggle(\'open\')">'
          + '<span class="kp-index" style="font-family:JetBrains Mono,monospace;font-size:13px;color:var(--cyan,#00d9ff);opacity:.7;">KP-' + String(i + 1).padStart(2, '0') + '</span>'
          + '<strong style="font-size:16px;flex:1;">' + kp.title + '</strong>'
          + '<span class="arrow">▶</span></div>'
          + '<div class="kp-body">' + kp.content + '</div>';
        kpList.appendChild(card);
      });
    }

    // Exercises
    if (chapter.exercises && chapter.exercises.length) {
      const exList = document.getElementById('exercise-list');
      chapter.exercises.forEach((ex, i) => {
        const card = document.createElement('div');
        card.className = 'exercise-card';
        let opts = '';
        ex.options.forEach((opt, oi) => {
          opts += '<label class="option" data-opt="' + oi + '" onclick="selectOption(this, ' + oi + ', ' + ex.answer + ', \'exp-' + i + '\')">' + opt + '</label>';
        });
        card.innerHTML = '<div class="exercise-q"><strong>练习 ' + (i + 1) + '：</strong>' + ex.question + '</div>'
          + '<div class="options">' + opts + '</div>'
          + '<div class="explanation" id="exp-' + i + '"><strong>解析：</strong>' + ex.explanation + '</div>';
        exList.appendChild(card);
      });
    }
  })
  .catch(err => {
    document.getElementById('loading').innerHTML = '<div class="error-page"><h2>🌌 星域数据未找到</h2><p>章节 ' + chapterId + ' 的数据正在加载中，请稍后再试。</p><br><a href="index.html" class="btn-ghost" style="padding:10px 24px;display:inline-block;">← 返回首页</a></div>';
  });

function selectOption(el, selected, answer, expId) {
  const parent = el.closest('.exercise-card');
  parent.querySelectorAll('.option').forEach(o => { o.classList.remove('selected', 'correct', 'wrong'); });
  el.classList.add('selected');
  if (selected === answer) {
    el.classList.add('correct');
  } else {
    el.classList.add('wrong');
    parent.querySelectorAll('.option[data-opt="' + answer + '"]').forEach(o => o.classList.add('correct'));
  }
  document.getElementById(expId).classList.add('show');
}
</script>
</body>
</html>
