# AI Master 单独部署（不跟 PyMaster 同机时用这份）。
#   两个平台一起上线请用 PyMaster 仓库里的 deploy/review-compose.yml，
#   那份会把两边都起起来，并共用一套 Caddy 做 HTTPS。
#
#   1. 填好 .env（模型密钥）
#   2. docker compose -f deploy/docker-compose.standalone.yml up -d --build
services:
  aimaster:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "5178"
      STARLAB_OPEN_BROWSER: "0"
      STARLAB_DATA_DIR: /var/aimaster-data
      # 评审演示账号：档案只在内存里，怎么点都不写盘（见 demo_mode.py）
      STARLAB_DEMO_USER: ${STARLAB_DEMO_USER:-}
      STARLAB_DEMO_PASSWORD: ${STARLAB_DEMO_PASSWORD:-}
    env_file:
      - ../.env
    volumes:
      - ./runtime-data:/var/aimaster-data
    ports:
      - "5178:5178"
    mem_limit: 1200m
